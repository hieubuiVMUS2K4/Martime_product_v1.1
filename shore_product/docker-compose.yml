# =============================================================
# SHORE LOCAL DEVELOPMENT - docker-compose.yml
# Usage:
#   cd shore_product
#   docker compose up -d --build
#
# Services:
#   postgres  → localhost:5434
#   pgadmin   → http://localhost:8081
#   backend   → http://localhost:5001
#   frontend  → http://localhost:3000
# =============================================================

services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-product}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in shore_product/.env}
      POSTGRES_DB: ${POSTGRES_DB:-productdb}
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-product} -d ${POSTGRES_DB:-productdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shore-local-net

  # ─── pgAdmin ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in shore_product/.env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - shore-local-net

  # ─── Shore Backend API (.NET 8) ────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-productdb};Username=${POSTGRES_USER:-product};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in shore_product/.env}"
      JWT__Key: "${JWT__Key:?JWT__Key must be set in shore_product/.env}"
      JWT__Issuer: "product"
      JWT__Audience: "product-users"
      Security__EnforceHttps: "${SECURITY_ENFORCE_HTTPS:-false}"
      Security__RequireInternalAccess: "${SECURITY_REQUIRE_INTERNAL_ACCESS:-false}"
      InternalAccess__ApiKey: "${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in shore_product/.env}"
      DataProtection__EncryptionKey: "${DATA_PROTECTION__ENCRYPTION_KEY:-}"
      SyncSecurity__RequireSignedRequests: "${SYNC_REQUIRE_SIGNED_REQUESTS:-false}"
      SyncSecurity__ProtocolVersion: "${SYNC_PROTOCOL_VERSION:-2}"
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shore-local-net

  # ─── Shore Frontend (React + Nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in shore_product/.env}"
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shore-local-net

volumes:
  postgres-local-data:
  backend-uploads:

networks:
  shore-local-net:
    driver: bridge
